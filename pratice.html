<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Face</title>
    <style>
     
        body {
           display: flex;
            justify-content: center;
            align-items: center;
        }

        
        .head {
            width: 400px;
            height: 400px;
            background-color: #ffef00;
           display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }

        
        .eye-row {
            display: flex;

            width: 85%;
        }

      
        .eye-white {
            width: 140px;
            height: 110px;
            background-color: #ffffff;
           display: flex;s
            align-items: center;
        }

       
        .pupil {
            width: 50px;
            height: 50px;
            background-color: #000000;
        }

   
        .mouth {
            width: 85%;
            height: 180px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
             position: relative;
            overflow: hidden;
        }

      
        .teeth-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding-top: 15px;
        }

       
        .tooth {
            width: 22px;
            height: 22px;
            background-color: #75540d;
        }

       
        .tongue-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            height: 80px;
        
        .tongue-half {
            width: 45px;
            height: 100%;
            background-color: #ff00d9;
        }
    }

     
        .tongue-divider {
            width: 6px;
            height: 100%;
            background-color: #000000;
        }
    </style>
</head>
<body>


    <div class="head">
        
       
        <div class="eye-row">
            <div class="eye-white">
                <div class="pupil"></div>
            </div>
            <div class="eye-white">
                <div class="pupil"></div>
            </div>
        </div>

      
        <div class="mouth">
          
            <div class="teeth-row">
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="tooth"></div>
            </div>

           
            <div class="tongue-row">
                <div class="tongue-half"></div>
                <div class="tongue-divider"></div>
                <div class="tongue-half"></div>
            </div>
        </div>

    </div>

</body>
</html>
